project:
  type: book

book:
  title: "Arquitectura de Influencia en Ecosistemas de Consumo"
  subtitle: "Estudio del Dataset Amazon - Modelización De Computación Predictiva"
  author: "Lu Bjornestad, William"
  date: today
  chapters:
    - index.qmd
    - preprocesado.qmd
    - part: "Análisis de Datos"
      chapters:
        - pca.qmd
        - sna.qmd
        - enlaces.qmd
    - conclusiones.qmd
    - part: "Anexos"
      chapters:
        - prompts.qmd

format:
  html:
    theme: default
    mainfont: "Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif"
    # backgroundcolor: "#fffff8"
    fontcolor: "#111111"
    fontsize: "1.1em"
    linestretch: 1.5
    grid:
      margin-width: 350px
    toc: true
    toc-depth: 3
    toc-location: left
    number-sections: true
    # code-fold: show
    code-tools: true
    code-annotations: hover
    citation-location: document

execute:
  freeze: auto
